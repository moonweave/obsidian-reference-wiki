<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'Helvetica Neue', Helvetica, Arial, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" role="img" aria-label="서재가 좋아진 과정">
<rect x="0.5" y="0.5" width="1199" height="759" rx="14" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="40.0" y="102.0" font-size="58" font-weight="600" fill="#0b0b0b" text-anchor="start">3%</text>
<text x="40.0" y="138.0" font-size="15.5" font-weight="500" fill="#0b0b0b" text-anchor="start">인용한 논문으로 뒷받침되지 않은</text>
<text x="40.0" y="158.0" font-size="15.5" font-weight="500" fill="#0b0b0b" text-anchor="start">AI 주장</text>
<text x="40.0" y="190.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">환각률 · 낮을수록 좋음</text>
<text x="40.0" y="210.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">주장 434개 검사</text>
