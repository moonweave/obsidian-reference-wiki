<text x="813.3" y="138.0" font-size="15.5" font-weight="500" fill="#0b0b0b" text-anchor="start">올바른 출처를 들어 답한 질문</text>
<text x="813.3" y="190.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">답변 정확도</text>
