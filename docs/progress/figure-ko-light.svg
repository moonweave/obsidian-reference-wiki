<text x="426.7" y="102.0" font-size="58" font-weight="600" fill="#0b0b0b" text-anchor="start">40/40</text>
<text x="426.7" y="138.0" font-size="15.5" font-weight="500" fill="#0b0b0b" text-anchor="start">답이 없는 질문에 AI가</text>
