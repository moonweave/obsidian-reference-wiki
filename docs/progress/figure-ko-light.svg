<text x="40.0" y="256.0" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">Claude Sonnet 5.5가 관리자의 서재로 질문 170개(영어·한국어)에 답했고, 주장 검사는 Claude Haiku 4.5가 했습니다. 걸린 줄은 Claude Opus 5.5가 다시 확인했습니다.</text>
